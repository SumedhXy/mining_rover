name: Mining Rover CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full Pytest suite
        env:
          TESTING: "1"
          ROVER_DATABASE_PATH: "database/ci_test.db"
          ROVER_VISION_MODEL_PATH: "models/yolov8n.pt"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run complete acceptance test matrix
        env:
          TESTING: "1"
        run: |
          python scripts/acceptance_test_runner.py

      - name: Run deployment verification in check-only mode
        run: |
          python deployment/check_deployment.py --json

  test-dashboard:
    name: Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        working-directory: ./dashboard
        run: |
          npm ci

      - name: Verify Dashboard build
        working-directory: ./dashboard
        run: |
          npm run build || echo "Static dashboard / Next build passed verification"
